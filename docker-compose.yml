services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flare
      POSTGRES_PASSWORD: flare_dev
      POSTGRES_DB: flare
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flare"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://flare:flare_dev@db:5432/flare
      JWT_SECRET: dev-secret-change-in-production-please
      NEXT_PUBLIC_BASE_URL: https://sendaflare.app
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
